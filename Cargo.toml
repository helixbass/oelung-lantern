[package]
name = "oelung-lantern"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
crossterm = { version = "0.29.0", features = ["event-stream"] }
derive_builder = "0.20.2"
futures = "0.3.31"
maybe-owned = "0.3.4"
oelung = { path = "../oelung" }
palette = "0.7.6"
proc_macros = { package = "oelung_lantern_proc_macros", path = "proc_macros" }
smol_str = "0.3.4"
squalid = { git = "https://github.com/helixbass/squalid", rev = "97ad97e8" }
thiserror = "2.0.17"
tokio = { version = "1", features = [ "full" ] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
uuid = { version = "1.19.0", features = [ "v4" ] }

[dev-dependencies]
anyhow = "1.0.100"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3.22"
